[project]
name = "tiny-browser-agent"
version = "0.1.0"
description = "Graph Visualization Tool for Browser-Agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "google-genai>=1.40.0",
    "patchright>=1.59.1",
    "playwright==1.55.0",
    "pydantic==2.12.0",
    "pyyaml>=6.0.0",
    "rich",
    "termcolor==3.1.0",
    "uvicorn[standard]>=0.29.0",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.pyright]
extraPaths = ["src", "."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
