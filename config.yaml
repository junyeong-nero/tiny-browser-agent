# provider : openai, gemini, openrouter
# models : inclusionai/ling-2.6-1t:free, gemini-3-flash-preview

models:
  actor:
    provider: openrouter
    model: openrouter/owl-alpha
  planner:
    provider: openrouter
    model: openrouter/owl-alpha
  summary:
    provider: openrouter
    model: openai/gpt-oss-120b:free

# Execution constraints used by BrowserAgent.
# - max_steps_per_subgoal: per-planner-subgoal step budget.
# - max_total_steps: total step budget for one task.
# - max_subgoals: maximum planned/replanned subgoals.
constraints:
  max_steps_per_subgoal: 30
  max_total_steps: 500
  max_subgoals: 20

# Supported providers:
#   actor/planner: gemini, openai, openrouter, nvidia
#   summary: openai, openrouter, nvidia
